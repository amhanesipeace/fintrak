{% extends "base.html" %}
{% block title %}Log in · FinTrack{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>💰 FinTrack</h1>
  <p class="sub">Log in to manage your money.</p>
  <form method="post" action="{{ url_for('auth.login') }}">
    <label>Username
      <input name="username" autocomplete="username" required autofocus>
    </label>
    <label>Password
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    <button class="btn" type="submit">Log in</button>
  </form>
  <p class="switch">No account? <a href="{{ url_for('auth.register') }}">Create one</a></p>
</div>
{% endblock %}
